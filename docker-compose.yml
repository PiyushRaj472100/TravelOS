version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelos-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - travelos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - travelos-network

networks:
  travelos-network:
    driver: bridge
